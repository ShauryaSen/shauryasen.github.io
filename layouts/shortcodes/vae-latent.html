{{- /* Interactive 2D VAE latent space. Decoder weights come from demos/vae/train_vae.py. */ -}}
{{- $base := "demos/vae/" | relURL -}}
<figure class="vae-demo" data-base="{{ $base }}">
  <div class="vae-panels">
    <div class="vae-panel">
      <div class="vae-label">Latent space <span>(click or drag)</span></div>
      <canvas class="vae-scatter" width="560" height="560" aria-label="2D latent space of MNIST test digits, colored by digit"></canvas>
      <div class="vae-legend"></div>
    </div>
    <div class="vae-panel vae-side">
      <div class="vae-label">Decoder output</div>
      <canvas class="vae-out" width="28" height="28" aria-label="Decoded image"></canvas>
      <div class="vae-z">z = (0.00, 0.00)</div>
      <button type="button" class="vae-grid-btn">Show decoded grid</button>
    </div>
  </div>
  <canvas class="vae-grid" width="560" height="560" hidden aria-label="Decoded grid of the latent space"></canvas>
  <figcaption>A VAE trained on MNIST. Each dot is a test digit's encoder mean $\mu(x)$, colored by its true label. Clicking runs the decoder on that point in your browser, including the empty regions no training digit landed on. <em>Show decoded grid</em> draws the whole space at once.</figcaption>
</figure>
<style>
.vae-demo { margin: 1.5rem 0 2rem; }
.vae-panels { display: flex; gap: 1rem; align-items: flex-start; }
.vae-panel { flex: 1 1 0; min-width: 0; }
.vae-side { flex: 0 0 168px; display: flex; flex-direction: column; gap: 0.6rem; }
.vae-label { font-size: 0.8rem; font-weight: 600; color: var(--secondary); margin-bottom: 0.4rem; }
.vae-label span { font-weight: 400; }
.vae-scatter, .vae-grid { width: 100%; aspect-ratio: 1; display: block; border: 1px solid var(--border); border-radius: var(--radius); background: var(--entry); cursor: crosshair; touch-action: none; }
.vae-grid { margin-top: 1rem; cursor: default; }
.vae-grid[hidden] { display: none; }
.vae-out { width: 168px; height: 168px; image-rendering: pixelated; border: 1px solid var(--border); border-radius: var(--radius); background: #000; }
.vae-z { font-family: var(--code-font, monospace); font-size: 0.8rem; color: var(--secondary); }
.vae-grid-btn { font: inherit; font-size: 0.8rem; padding: 0.35rem 0.6rem; border: 1px solid var(--border); border-radius: var(--radius); background: var(--entry); color: var(--primary); cursor: pointer; }
.vae-legend { display: flex; flex-wrap: wrap; gap: 0.25rem 0.7rem; margin-top: 0.5rem; font-size: 0.75rem; color: var(--secondary); }
.vae-legend i { display: inline-block; width: 0.6rem; height: 0.6rem; border-radius: 50%; margin-right: 0.25rem; vertical-align: -1px; }
.post-content .vae-demo figcaption { margin-top: 0.75rem; padding-top: 0.6rem; border-top: 1px solid var(--border); font-size: 0.85rem; font-weight: 400; font-style: italic; color: var(--secondary); text-align: left; }
.post-content .vae-demo figcaption * { font-weight: 400; color: inherit; font-size: inherit; }
.post-content .vae-demo figcaption em { font-style: normal; }
@media (max-width: 600px) {
  .vae-panels { flex-direction: column; }
  .vae-side { flex: none; flex-direction: row; flex-wrap: wrap; align-items: center; }
  .vae-out { width: 112px; height: 112px; }
}
</style>
<script>
(() => {
  const root = document.currentScript.previousElementSibling.previousElementSibling;
  const base = root.dataset.base;
  const COLORS = ['#4e79a7', '#f28e2b', '#59a14f', '#e15759', '#b07aa1', '#9c755f', '#ff9da7', '#76b7b2', '#edc948', '#8c8c8c'];
  const R = 4; // latent axes span [-R, R]
  const scatter = root.querySelector('.vae-scatter');
  const out = root.querySelector('.vae-out');
  const zLabel = root.querySelector('.vae-z');
  const gridCanvas = root.querySelector('.vae-grid');
  const gridBtn = root.querySelector('.vae-grid-btn');
  root.querySelector('.vae-legend').innerHTML =
    COLORS.map((c, d) => `<span><i style="background:${c}"></i>${d}</span>`).join('');

  // float16 -> float32
  function halfToFloat(h) {
    const s = h & 0x8000 ? -1 : 1, e = (h >> 10) & 0x1f, f = h & 0x3ff;
    if (e === 0) return s * Math.pow(2, -14) * (f / 1024);
    if (e === 31) return f ? NaN : s * Infinity;
    return s * Math.pow(2, e - 15) * (1 + f / 1024);
  }

  let layers = null, points = [], marker = null;

  function decode(z) {
    let h = Float32Array.from(z);
    layers.forEach(({ W, b, nIn, nOut }, li) => {
      const y = new Float32Array(nOut);
      for (let o = 0; o < nOut; o++) {
        let s = b[o];
        const row = o * nIn;
        for (let i = 0; i < nIn; i++) s += W[row + i] * h[i];
        y[o] = li < layers.length - 1 ? Math.max(0, s) : 1 / (1 + Math.exp(-s));
      }
      h = y;
    });
    return h; // 784 pixel intensities in [0, 1]
  }

  function paintDigit(ctx, px, x0, y0, size) {
    const img = ctx.createImageData(28, 28);
    for (let i = 0; i < 784; i++) {
      const v = Math.round(px[i] * 255);
      img.data[4 * i] = img.data[4 * i + 1] = img.data[4 * i + 2] = v;
      img.data[4 * i + 3] = 255;
    }
    if (size === 28) { ctx.putImageData(img, x0, y0); return; }
    const tmp = document.createElement('canvas'); tmp.width = tmp.height = 28;
    tmp.getContext('2d').putImageData(img, 0, 0);
    ctx.imageSmoothingEnabled = false;
    ctx.drawImage(tmp, x0, y0, size, size);
  }

  const toPx = (v, n) => ((v + R) / (2 * R)) * n;
  const css = (name) => getComputedStyle(document.body).getPropertyValue(name).trim();

  function drawScatter() {
    const ctx = scatter.getContext('2d'), n = scatter.width;
    ctx.clearRect(0, 0, n, n);
    ctx.strokeStyle = css('--border') || '#ddd'; ctx.lineWidth = 1;
    for (let t = -R; t <= R; t++) {
      const p = Math.round(toPx(t, n)) + 0.5;
      ctx.beginPath(); ctx.moveTo(p, 0); ctx.lineTo(p, n); ctx.moveTo(0, p); ctx.lineTo(n, p); ctx.stroke();
    }
    ctx.globalAlpha = 0.55;
    for (const [a, b, y] of points) {
      ctx.fillStyle = COLORS[y];
      ctx.beginPath(); ctx.arc(toPx(a, n), toPx(-b, n), 2.2, 0, 2 * Math.PI); ctx.fill();
    }
    ctx.globalAlpha = 1;
    if (marker) {
      const [mx, my] = [toPx(marker[0], n), toPx(-marker[1], n)];
      ctx.strokeStyle = css('--primary') || '#000'; ctx.lineWidth = 2;
      ctx.beginPath(); ctx.arc(mx, my, 9, 0, 2 * Math.PI); ctx.stroke();
      ctx.beginPath(); ctx.moveTo(mx - 14, my); ctx.lineTo(mx + 14, my); ctx.moveTo(mx, my - 14); ctx.lineTo(mx, my + 14); ctx.stroke();
    }
  }

  function sampleAt(z) {
    marker = z;
    paintDigit(out.getContext('2d'), decode(z), 0, 0, 28);
    zLabel.textContent = `z = (${z[0].toFixed(2)}, ${z[1].toFixed(2)})`;
    drawScatter();
  }

  function eventToZ(e) {
    const r = scatter.getBoundingClientRect();
    const fx = (e.clientX - r.left) / r.width, fy = (e.clientY - r.top) / r.height;
    return [fx * 2 * R - R, -(fy * 2 * R - R)];
  }

  function drawGrid() {
    const ctx = gridCanvas.getContext('2d'), K = 20, cell = gridCanvas.width / K;
    for (let r = 0; r < K; r++)
      for (let c = 0; c < K; c++) {
        const z = [-R + (c + 0.5) * (2 * R / K), R - (r + 0.5) * (2 * R / K)];
        paintDigit(ctx, decode(z), c * cell, r * cell, cell);
      }
  }

  let dragging = false;
  scatter.addEventListener('pointerdown', (e) => { if (!layers) return; dragging = true; scatter.setPointerCapture(e.pointerId); sampleAt(eventToZ(e)); });
  scatter.addEventListener('pointermove', (e) => { if (dragging) sampleAt(eventToZ(e)); });
  scatter.addEventListener('pointerup', () => { dragging = false; });
  gridBtn.addEventListener('click', () => {
    gridCanvas.hidden = !gridCanvas.hidden;
    gridBtn.textContent = gridCanvas.hidden ? 'Show decoded grid' : 'Hide decoded grid';
    if (!gridCanvas.hidden) drawGrid();
  });
  // PaperMod's theme toggle flips a class on <body> or data-theme on <html>, depending on version.
  const redraw = new MutationObserver(drawScatter);
  redraw.observe(document.body, { attributes: true, attributeFilter: ['class'] });
  redraw.observe(document.documentElement, { attributes: true, attributeFilter: ['data-theme', 'class'] });

  Promise.all([
    fetch(base + 'latents.json').then((r) => r.json()),
    fetch(base + 'decoder.bin').then((r) => r.arrayBuffer()),
  ]).then(([meta, buf]) => {
    const u16 = new Uint16Array(buf);
    let off = 0;
    const take = (n) => { const a = new Float32Array(n); for (let i = 0; i < n; i++) a[i] = halfToFloat(u16[off + i]); off += n; return a; };
    layers = meta.layers.map(([nIn, nOut]) => ({ nIn, nOut, W: take(nIn * nOut), b: take(nOut) }));
    points = meta.points;
    sampleAt([0, 0]);
  }).catch(() => { zLabel.textContent = 'Could not load decoder weights.'; });
})();
</script>
